name: Build Android Fast Fetch test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-fast-fetch-normal-feed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout obsidian-livesync fork
        uses: actions/checkout@v4

      - name: Checkout patched livesync-commonlib
        uses: actions/checkout@v4
        with:
          repository: Tideus/livesync-commonlib
          ref: fix/android-fast-fetch-normal-feed
          path: commonlib

      - name: Add Fast Fetch recovery diagnostics
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("commonlib/src/serviceModules/Rebuilder.ts")
          s = p.read_text()

          replacements = [
              (
                  "    async fetchLocal(makeLocalChunkBeforeSync?: boolean, preventMakeLocalFilesBeforeSync?: boolean, autoResume = true) {\n        await this.setting.suspendExtraSync();",
                  "    async fetchLocal(makeLocalChunkBeforeSync?: boolean, preventMakeLocalFilesBeforeSync?: boolean, autoResume = true) {\n        this._log(\"[FastFetchDebug] fetchLocal entered\", LOG_LEVEL_NOTICE);\n        await this.setting.suspendExtraSync();",
              ),
              (
                  "    private async performFetchLocal(\n        makeLocalChunkBeforeSync?: boolean,\n        preventMakeLocalFilesBeforeSync?: boolean,\n        autoResume = true\n    ) {\n        this.appLifecycle.resetIsReady();",
                  "    private async performFetchLocal(\n        makeLocalChunkBeforeSync?: boolean,\n        preventMakeLocalFilesBeforeSync?: boolean,\n        autoResume = true\n    ) {\n        this._log(\"[FastFetchDebug] performFetchLocal entered\", LOG_LEVEL_NOTICE);\n        this.appLifecycle.resetIsReady();",
              ),
              (
                  "        await this.resetLocalDatabase();\n        this.clearFastFetchCheckpoint();",
                  "        this._log(\"[FastFetchDebug] Standard Fetch: about to reset local database\", LOG_LEVEL_NOTICE);\n        await this.resetLocalDatabase();\n        this._log(\"[FastFetchDebug] Standard Fetch: resetLocalDatabase returned\", LOG_LEVEL_NOTICE);\n        this.clearFastFetchCheckpoint();",
              ),
              (
                  "    async fetchLocalDBFast(autoResume: boolean) {\n        await this.setting.suspendExtraSync();",
                  "    async fetchLocalDBFast(autoResume: boolean) {\n        this._log(\"[FastFetchDebug] fetchLocalDBFast entered\", LOG_LEVEL_NOTICE);\n        await this.setting.suspendExtraSync();",
              ),
              (
                  "    private async performFetchLocalDBFast(\n        settings: ReturnType<SettingService[\"currentSettings\"]>,\n        autoResume: boolean\n    ) {\n        this.appLifecycle.resetIsReady();",
                  "    private async performFetchLocalDBFast(\n        settings: ReturnType<SettingService[\"currentSettings\"]>,\n        autoResume: boolean\n    ) {\n        this._log(\"[FastFetchDebug] performFetchLocalDBFast entered\", LOG_LEVEL_NOTICE);\n        this.appLifecycle.resetIsReady();",
              ),
              (
                  "        } else {\n            await this.resetLocalDatabase();\n            await delay(1000);\n        }\n\n        let localDB = this.database.localDatabase.localDatabase;",
                  "        } else {\n            this._log(\"[FastFetchDebug] Fast Fetch: about to reset local database\", LOG_LEVEL_NOTICE);\n            await this.resetLocalDatabase();\n            this._log(\"[FastFetchDebug] Fast Fetch: resetLocalDatabase returned\", LOG_LEVEL_NOTICE);\n            await delay(1000);\n            this._log(\"[FastFetchDebug] Fast Fetch: post-reset delay finished\", LOG_LEVEL_NOTICE);\n        }\n\n        let localDB = this.database.localDatabase.localDatabase;\n        this._log(\"[FastFetchDebug] Fast Fetch: local DB handle acquired\", LOG_LEVEL_NOTICE);",
              ),
              (
                  "        const securitySeed = await this.replicator.createRemoteResource(REMOTE_RESOURCE_KINDS.SECURITY_SEED, settings);",
                  "        this._log(\"[FastFetchDebug] Fast Fetch: requesting security seed\", LOG_LEVEL_NOTICE);\n        const securitySeed = await this.replicator.createRemoteResource(REMOTE_RESOURCE_KINDS.SECURITY_SEED, settings);\n        this._log(\"[FastFetchDebug] Fast Fetch: security seed request returned\", LOG_LEVEL_NOTICE);",
              ),
              (
                  "                    await fetchChangesForInitialSync(\n                        localDB,",
                  "                    this._log(\"[FastFetchDebug] Fast Fetch: about to call fetchChangesForInitialSync\", LOG_LEVEL_NOTICE);\n                    await fetchChangesForInitialSync(\n                        localDB,",
              ),
              (
                  "    async resetLocalDatabase() {\n        const suffix = this.API.getAppID() || \"\";",
                  "    async resetLocalDatabase() {\n        this._log(\"[FastFetchDebug] resetLocalDatabase entered\", LOG_LEVEL_NOTICE);\n        const suffix = this.API.getAppID() || \"\";",
              ),
              (
                  "        this.events.emitEvent(EVENT_DATABASE_REBUILT);\n    }",
                  "        this._log(\"[FastFetchDebug] resetLocalDatabase: database reset completed; emitting EVENT_DATABASE_REBUILT\", LOG_LEVEL_NOTICE);\n        this.events.emitEvent(EVENT_DATABASE_REBUILT);\n        this._log(\"[FastFetchDebug] resetLocalDatabase: EVENT_DATABASE_REBUILT returned\", LOG_LEVEL_NOTICE);\n    }",
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"diagnostic patch anchor not found:\n{old[:160]}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Add StreamingFetch transport diagnostics
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("commonlib/src/pouchdb/StreamingFetch.ts")
          s = p.read_text()

          replacements = [
              (
                  "): Promise<void> {\n    let totalFetched = 0;\n    let totalValidFetched = 0;\n    let totalBytes = 0;",
                  "): Promise<void> {\n    Logger(\"[FastFetchDebug] fetchChangesForInitialSync entered\");\n    let totalFetched = 0;\n    let totalValidFetched = 0;\n    let totalBytes = 0;",
              ),
              (
                  "        const response = await fetchResponse(\n            statusURL.toString(),\n            { method: \"GET\", headers: fetchHeaders },\n            \"read changes status\"\n        );\n        return parseJSONResponse<DatabaseSyncStatus>(\n            await readResponseText(response, \"read changes status\"),",
                  "        Logger(`[FastFetchDebug] status probe begin since=${statusSince}`);\n        Logger(`[FastFetchDebug] status probe URL: ${statusURL.toString()}`);\n        const response = await fetchResponse(\n            statusURL.toString(),\n            { method: \"GET\", headers: fetchHeaders },\n            \"read changes status\"\n        );\n        Logger(`[FastFetchDebug] status probe response status: ${response.status}`);\n        const responseText = await readResponseText(response, \"read changes status\");\n        Logger(`[FastFetchDebug] status probe body length: ${responseText.length}`);\n        return parseJSONResponse<DatabaseSyncStatus>(\n            responseText,",
              ),
              (
                  "    const targetStatus = await fetchStatus(\"now\");\n    const progressTargetSeq = targetStatus.last_seq;",
                  "    Logger(\"[FastFetchDebug] target probe starting\");\n    const targetStatus = await fetchStatus(\"now\");\n    Logger(\"[FastFetchDebug] target probe completed\");\n    const progressTargetSeq = targetStatus.last_seq;",
              ),
              (
                  "        const status = await fetchStatus(pageSince);\n        if (!Array.isArray(status.results)) {",
                  "        Logger(`[FastFetchDebug] available-changes probe starting since=${pageSince}`);\n        const status = await fetchStatus(pageSince);\n        Logger(`[FastFetchDebug] available-changes probe returned pending=${status.pending} results=${Array.isArray(status.results) ? status.results.length : -1}`);\n        if (!Array.isArray(status.results)) {",
              ),
              (
                  "        const response = await fetchResponse(\n            changesURL.toString(),\n            { method: \"GET\", headers: fetchHeaders },\n            \"fetch a bounded normal changes page\"\n        );\n        const raw = await readResponseText(response, \"read a bounded normal changes page\");",
                  "        Logger(`[FastFetchDebug] page fetch starting since=${pageSince} limit=${pageLimit}`);\n        Logger(`[FastFetchDebug] page fetch URL: ${changesURL.toString()}`);\n        const response = await fetchResponse(\n            changesURL.toString(),\n            { method: \"GET\", headers: fetchHeaders },\n            \"fetch a bounded normal changes page\"\n        );\n        Logger(`[FastFetchDebug] page fetch response status: ${response.status}`);\n        const raw = await readResponseText(response, \"read a bounded normal changes page\");\n        Logger(`[FastFetchDebug] page fetch body length: ${raw.length}`);",
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"StreamingFetch diagnostic anchor not found:\n{old[:180]}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build patched commonlib package
        working-directory: commonlib
        run: |
          npm ci
          npm run build:package
          npm pack ./.package --pack-destination ..

      - name: Install LiveSync dependencies
        run: npm ci

      - name: Replace commonlib with patched package
        run: |
          PKG=$(ls vrtmrz-livesync-commonlib-*.tgz | head -n 1)
          echo "Using patched package: $PKG"
          npm install --no-save "./$PKG"

      - name: Build Self-hosted LiveSync
        run: npm run build

      - name: Verify plugin files and diagnostics
        run: |
          test -f main.js
          test -f manifest.json
          grep -Fq '[FastFetchDebug] fetchLocalDBFast entered' main.js
          grep -Fq '[FastFetchDebug] performFetchLocalDBFast entered' main.js
          grep -Fq '[FastFetchDebug] Fast Fetch: about to call fetchChangesForInitialSync' main.js
          grep -Fq '[FastFetchDebug] fetchChangesForInitialSync entered' main.js
          grep -Fq '[FastFetchDebug] target probe starting' main.js
          grep -Fq '[FastFetchDebug] status probe response status:' main.js
          grep -Fq '[FastFetchDebug] page fetch starting' main.js
          if [ -f styles.css ]; then echo "styles.css present"; else echo "styles.css not present; continuing"; fi

      - name: Assemble test plugin
        run: |
          mkdir -p artifact
          cp main.js manifest.json artifact/
          if [ -f styles.css ]; then cp styles.css artifact/; fi
          printf '%s\n' \
            'Experimental Android Fast Fetch diagnostic build v2.' \
            'Commonlib branch: Tideus/livesync-commonlib@fix/android-fast-fetch-normal-feed' \
            'Fast Fetch uses finite CouchDB feed=normal pages instead of ReadableStream feed=continuous.' \
            'This build logs both Rebuilder and StreamingFetch [FastFetchDebug] checkpoints.' \
            > artifact/TEST-BUILD.txt

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-livesync-android-fast-fetch-diagnostic-v2
          path: artifact/
          if-no-files-found: error
