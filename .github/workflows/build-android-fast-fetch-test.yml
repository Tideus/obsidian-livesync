name: Build Android Fast Fetch test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-fast-fetch-normal-feed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout obsidian-livesync fork
        uses: actions/checkout@v4

      - name: Checkout patched livesync-commonlib
        uses: actions/checkout@v4
        with:
          repository: Tideus/livesync-commonlib
          ref: fix/android-fast-fetch-normal-feed
          path: commonlib

      - name: Apply Fast Fetch test patch
        run: |
          python .github/scripts/prepare_fast_fetch_test.py
          python .github/scripts/patch_mobile_fast_fetch_transport.py
          python .github/scripts/patch_fast_fetch_cached_security_seed.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build patched commonlib package
        working-directory: commonlib
        run: |
          npm ci
          npm run check:types
          npm run build:package
          npm pack ./.package --pack-destination ..

      - name: Install LiveSync dependencies
        run: npm ci

      - name: Replace commonlib with patched package
        run: |
          PKG=$(ls vrtmrz-livesync-commonlib-*.tgz | head -n 1)
          echo "Using $PKG"
          npm install --no-save "./$PKG"

      - name: Build Self-hosted LiveSync
        run: npm run build

      - name: Verify test build
        run: |
          test -f main.js
          test -f manifest.json
          grep -Fq '[FastFetchDebug] fetchChangesForInitialSync entered' main.js
          grep -Fq '[FastFetchDebug] page fetch starting' main.js
          grep -Fq '[FastFetchDebug] requestUrl transport begin:' main.js
          grep -Fq 'requestUrl native sync-params transport:' main.js
          grep -Fq '_local/obsidian_livesync_sync_parameters' main.js
          grep -Fq 'setFetch' commonlib/.package/dist/common/coreEnvFunctions.js
          grep -Fq 'rowCount' commonlib/src/pouchdb/StreamingFetch.ts
          grep -Fq 'const pageSize = 50' commonlib/src/pouchdb/StreamingFetch.ts
          grep -Fq 'cached security seed ready bytes=' commonlib/.package/dist/serviceModules/Rebuilder.js
          grep -Fq 'async () => cachedSecuritySeed' commonlib/src/serviceModules/Rebuilder.ts
          grep -Fq 'decryptWorker' commonlib/.package/dist/pouchdb/encryption.js
          grep -Fq 'decryptHKDFWorker' commonlib/.package/dist/pouchdb/encryption.js

      - name: Assemble plugin artifact
        run: |
          mkdir -p artifact
          cp main.js manifest.json artifact/
          if [ -f styles.css ]; then cp styles.css artifact/; fi
          printf '%s\n' \
            'Android Fast Fetch requestUrl + native sync params + cached security seed + 50-row pages test build.' \
            'CouchDB _changes and _local/obsidian_livesync_sync_parameters use Obsidian requestUrl on mobile with retries/timeouts.' \
            'Security Seed is read once before Fast Fetch and reused for all crypto operations.' \
            'Fast Fetch requests up to 50 changes per CouchDB page instead of one request per document.' \
            'Standard Web Worker crypto remains enabled.' \
            > artifact/TEST-BUILD.txt

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-livesync-android-fast-fetch-page50-native-seed
          path: artifact/
          if-no-files-found: error
