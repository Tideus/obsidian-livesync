name: Build Android Fast Fetch test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-fast-fetch-normal-feed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout obsidian-livesync fork
        uses: actions/checkout@v4

      - name: Checkout patched livesync-commonlib
        uses: actions/checkout@v4
        with:
          repository: Tideus/livesync-commonlib
          ref: fix/android-fast-fetch-normal-feed
          path: commonlib

      - name: Apply direct-page Fast Fetch workaround
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("commonlib/src/pouchdb/StreamingFetch.ts")
          s = p.read_text()

          old = '''    const readAvailableChanges = async (pageSince: DBSequence): Promise<number> => {
        const status = await fetchStatus(pageSince);
        if (!Array.isArray(status.results)) {
            throw new StreamingFetchFailure(
                "protocol",
                "Fast Fetch received changes status without a valid results list.",
                false
            );
        }
        const pending = status.pending;
        if (typeof pending !== "number" || !Number.isSafeInteger(pending) || pending < 0) {
            throw new StreamingFetchFailure(
                "protocol",
                "Fast Fetch received changes status without a valid pending count.",
                false
            );
        }
        const available = status.results.length + pending;
        if (!Number.isSafeInteger(available)) {
            throw new StreamingFetchFailure(
                "protocol",
                "Fast Fetch received a changes count outside the supported range.",
                false
            );
        }
        return available;
    };

    const fetchPageNormal = async (pageSince: DBSequence, pageLimit: number): Promise<DBSequence> => {'''
          new = '''    const fetchPageNormal = async (
        pageSince: DBSequence,
        pageLimit: number
    ): Promise<{ lastSequence: DBSequence; rowCount: number; pending: number }> => {'''
          if old not in s:
              raise SystemExit("direct-page patch: readAvailableChanges anchor not found")
          s = s.replace(old, new, 1)

          old = '''        if (page.results.length === 0) {
            throw new StreamingFetchFailure(
                "transport",
                "Fast Fetch received no rows after its status probe reported available changes.",
                true
            );
        }

        for (const change of page.results) {'''
          new = '''        const pending = typeof page.pending === "number" && Number.isSafeInteger(page.pending) && page.pending >= 0
            ? page.pending
            : 0;

        if (page.results.length === 0) {
            await batchWriter.flush();
            await saveCheckpoint(onCheckpoint, page.last_seq);
            reportProgress(true);
            return { lastSequence: page.last_seq, rowCount: 0, pending };
        }

        for (const change of page.results) {'''
          if old not in s:
              raise SystemExit("direct-page patch: empty-page anchor not found")
          s = s.replace(old, new, 1)

          old = '''        await batchWriter.flush();
        await saveCheckpoint(onCheckpoint, page.last_seq);
        reportProgress(true);
        return page.last_seq;
    };

    try {
        let pageSince: DBSequence = since;
        let started = false;

        while (true) {
            const available = await readAvailableChanges(pageSince);
            docsToFetch = Math.max(docsToFetch, totalFetched + available);
            if (available === 0) break;

            if (!started) {
                started = true;
                Logger(
                    `Starting initial synchronisation. Current sequence: ${since}, Target sequence: ${progressTargetSeq}, Documents to fetch: ${docsToFetch}.`
                );
            }

            const pageLimit = Math.min(FAST_FETCH_CHANGES_PAGE_LIMIT, available);
            pageSince = await fetchPageNormal(pageSince, pageLimit);
        }
'''
          new = '''        await batchWriter.flush();
        await saveCheckpoint(onCheckpoint, page.last_seq);
        reportProgress(true);
        return { lastSequence: page.last_seq, rowCount: page.results.length, pending };
    };

    try {
        let pageSince: DBSequence = since;
        let started = false;

        while (true) {
            const page = await fetchPageNormal(pageSince, FAST_FETCH_CHANGES_PAGE_LIMIT);
            pageSince = page.lastSequence;
            docsToFetch = Math.max(docsToFetch, totalFetched + page.pending);

            if (page.rowCount > 0 && !started) {
                started = true;
                Logger(
                    `Starting initial synchronisation. Current sequence: ${since}, Target sequence: ${progressTargetSeq}, Documents to fetch: ${docsToFetch}.`
                );
            }

            if (page.rowCount === 0 || page.pending === 0) break;
        }
'''
          if old not in s:
              raise SystemExit("direct-page patch: paging loop anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Add Fast Fetch recovery diagnostics
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("commonlib/src/serviceModules/Rebuilder.ts")
          s = p.read_text()
          replacements = [
              ("    async fetchLocalDBFast(autoResume: boolean) {\n        await this.setting.suspendExtraSync();", "    async fetchLocalDBFast(autoResume: boolean) {\n        this._log(\"[FastFetchDebug] fetchLocalDBFast entered\", LOG_LEVEL_NOTICE);\n        await this.setting.suspendExtraSync();"),
              ("    private async performFetchLocalDBFast(\n        settings: ReturnType<SettingService[\"currentSettings\"]>,\n        autoResume: boolean\n    ) {\n        this.appLifecycle.resetIsReady();", "    private async performFetchLocalDBFast(\n        settings: ReturnType<SettingService[\"currentSettings\"]>,\n        autoResume: boolean\n    ) {\n        this._log(\"[FastFetchDebug] performFetchLocalDBFast entered\", LOG_LEVEL_NOTICE);\n        this.appLifecycle.resetIsReady();"),
              ("        } else {\n            await this.resetLocalDatabase();\n            await delay(1000);\n        }\n\n        let localDB = this.database.localDatabase.localDatabase;", "        } else {\n            this._log(\"[FastFetchDebug] Fast Fetch: about to reset local database\", LOG_LEVEL_NOTICE);\n            await this.resetLocalDatabase();\n            this._log(\"[FastFetchDebug] Fast Fetch: resetLocalDatabase returned\", LOG_LEVEL_NOTICE);\n            await delay(1000);\n            this._log(\"[FastFetchDebug] Fast Fetch: post-reset delay finished\", LOG_LEVEL_NOTICE);\n        }\n\n        let localDB = this.database.localDatabase.localDatabase;\n        this._log(\"[FastFetchDebug] Fast Fetch: local DB handle acquired\", LOG_LEVEL_NOTICE);"),
              ("        const securitySeed = await this.replicator.createRemoteResource(REMOTE_RESOURCE_KINDS.SECURITY_SEED, settings);", "        this._log(\"[FastFetchDebug] Fast Fetch: requesting security seed\", LOG_LEVEL_NOTICE);\n        const securitySeed = await this.replicator.createRemoteResource(REMOTE_RESOURCE_KINDS.SECURITY_SEED, settings);\n        this._log(\"[FastFetchDebug] Fast Fetch: security seed request returned\", LOG_LEVEL_NOTICE);"),
              ("                    await fetchChangesForInitialSync(\n                        localDB,", "                    this._log(\"[FastFetchDebug] Fast Fetch: about to call fetchChangesForInitialSync\", LOG_LEVEL_NOTICE);\n                    await fetchChangesForInitialSync(\n                        localDB,"),
              ("    async resetLocalDatabase() {\n        const suffix = this.API.getAppID() || \"\";", "    async resetLocalDatabase() {\n        this._log(\"[FastFetchDebug] resetLocalDatabase entered\", LOG_LEVEL_NOTICE);\n        const suffix = this.API.getAppID() || \"\";"),
              ("        this.events.emitEvent(EVENT_DATABASE_REBUILT);\n    }", "        this._log(\"[FastFetchDebug] resetLocalDatabase: database reset completed; emitting EVENT_DATABASE_REBUILT\", LOG_LEVEL_NOTICE);\n        this.events.emitEvent(EVENT_DATABASE_REBUILT);\n        this._log(\"[FastFetchDebug] resetLocalDatabase: EVENT_DATABASE_REBUILT returned\", LOG_LEVEL_NOTICE);\n    }"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"recovery diagnostic anchor not found: {old[:120]}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Add StreamingFetch diagnostics
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("commonlib/src/pouchdb/StreamingFetch.ts")
          s = p.read_text()
          replacements = [
              ("    let totalFetched = 0;\n    let totalValidFetched = 0;", "    Logger(\"[FastFetchDebug] fetchChangesForInitialSync entered\");\n    let totalFetched = 0;\n    let totalValidFetched = 0;"),
              ("        const response = await fetchResponse(\n            statusURL.toString(),", "        Logger(`[FastFetchDebug] status probe begin since=${statusSince}`);\n        Logger(`[FastFetchDebug] status probe URL: ${statusURL.toString()}`);\n        const response = await fetchResponse(\n            statusURL.toString(),"),
              ("        return parseJSONResponse<DatabaseSyncStatus>(\n            await readResponseText(response, \"read changes status\"),", "        Logger(`[FastFetchDebug] status probe response status: ${response.status}`);\n        const statusRaw = await readResponseText(response, \"read changes status\");\n        Logger(`[FastFetchDebug] status probe body length: ${statusRaw.length}`);\n        return parseJSONResponse<DatabaseSyncStatus>(\n            statusRaw,"),
              ("    const targetStatus = await fetchStatus(\"now\");", "    Logger(\"[FastFetchDebug] target probe starting\");\n    const targetStatus = await fetchStatus(\"now\");\n    Logger(\"[FastFetchDebug] target probe completed\");"),
              ("        const response = await fetchResponse(\n            changesURL.toString(),", "        Logger(`[FastFetchDebug] page fetch starting since=${pageSince} limit=${pageLimit}`);\n        Logger(`[FastFetchDebug] page fetch URL: ${changesURL.toString()}`);\n        const response = await fetchResponse(\n            changesURL.toString(),"),
              ("        const raw = await readResponseText(response, \"read a bounded normal changes page\");", "        Logger(`[FastFetchDebug] page fetch response status: ${response.status}`);\n        const raw = await readResponseText(response, \"read a bounded normal changes page\");\n        Logger(`[FastFetchDebug] page fetch body length: ${raw.length}`);"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"stream diagnostic anchor not found: {old[:120]}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build patched commonlib package
        working-directory: commonlib
        run: |
          npm ci
          npm run build:package
          npm pack ./.package --pack-destination ..

      - name: Install LiveSync dependencies
        run: npm ci

      - name: Replace commonlib with patched package
        run: |
          PKG=$(ls vrtmrz-livesync-commonlib-*.tgz | head -n 1)
          npm install --no-save "./$PKG"

      - name: Build Self-hosted LiveSync
        run: npm run build

      - name: Verify direct-page workaround
        run: |
          test -f main.js
          test -f manifest.json
          grep -Fq '[FastFetchDebug] fetchChangesForInitialSync entered' main.js
          grep -Fq '[FastFetchDebug] page fetch starting' main.js

      - name: Assemble test plugin
        run: |
          mkdir -p artifact
          cp main.js manifest.json artifact/
          if [ -f styles.css ]; then cp styles.css artifact/; fi
          printf '%s\n' \
            'Android Fast Fetch direct-page test build.' \
            'The hanging since=0 status pre-probe has been removed.' \
            'Finite feed=normal pages are fetched directly and paginated by pending/last_seq.' \
            > artifact/TEST-BUILD.txt

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-livesync-android-fast-fetch-direct-page
          path: artifact/
          if-no-files-found: error
